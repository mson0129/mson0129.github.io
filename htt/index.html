<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#178c8d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="한메타자교사"><title>한메타자교사 3.05 · WASM</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="stylesheet" href="./style.css?v=8"></head>
<body><main id="dos-stage"><canvas id="screen" tabindex="0" width="640" height="480" aria-label="한메타자교사 화면"></canvas><div id="canvas-controls" aria-label="화면 조작"></div><input id="puzzle-ime" autocomplete="off" spellcheck="false" aria-label="퍼즐 글자 입력" hidden></main><div id="legacy" inert aria-hidden="true"><main class="desktop"><header><div class="brand"><span class="logo">한</span><div><h1>한메타자교사 <small>3.05 · WASM</small></h1><p>손끝에서 시작하는 한글 연습</p></div></div><div class="header-actions"><button id="help" aria-label="도움말">?</button><button id="fullscreen" aria-label="전체 화면">⛶</button></div></header>
<section class="window"><div class="titlebar"><span>한메타자교사</span><span id="clock"></span></div><nav aria-label="연습 메뉴"><button data-mode="home" class="active">한메</button><button data-mode="keys">자리익힘</button><button data-mode="words">낱말익힘</button><button data-mode="short">문장연습</button><button data-mode="venice">베네치아</button><button data-mode="puzzle">낱말맞추기</button><button data-mode="history">통계</button></nav>
<div class="options"><label>글자 <select id="language"><option value="ko">한글 · 두벌식</option><option value="en">영문</option></select></label><label id="group-label" hidden>자리 <select id="group"></select></label><label id="kind-label" hidden>연습 <select id="kind"><option value="short">단문 연습</option><option value="long">장문 연습</option><option value="test">타자 검정</option></select></label><label id="text-label" hidden>글 <select id="text-choice"><option value="0">찰리 채플린의 인생관</option><option value="1">연습글 2</option><option value="2">연습글 3</option><option value="3">연습글 4</option><option value="4">연습글 5</option></select></label><label id="duration-label" hidden>시간 <select id="duration"><option value="60">1분</option><option value="180">3분</option><option value="300">5분</option></select></label><label id="level-label" hidden>단계 <select id="level"></select></label><label id="puzzle-label" hidden>문제 <select id="puzzle-choice"></select></label><span id="offline" role="status"></span></div>
<div id="home" class="home"><div class="intro-mark">한메</div><h2>한메타자교사</h2><p class="version">VERSION 3.05</p><div class="home-grid"><button data-mode="keys"><b>01　자리익힘</b><span>글쇠의 위치부터 차근차근</span></button><button data-mode="words"><b>02　낱말익힘</b><span>원본 낱말로 손에 익히기</span></button><button data-mode="short"><b>03　문장연습</b><span>속담, 장문, 타자 검정</span></button><button data-mode="venice"><b>04　베네치아</b><span>내려오는 낱말을 입력하세요</span></button><button data-mode="puzzle"><b>05　낱말맞추기</b><span>가로세로 한글 낱말 퍼즐</span></button><button data-mode="history"><b>06　통계</b><span>내 연습 기록 살펴보기</span></button></div><p class="home-note">한글 연습은 기기의 한글 입력기를 켜 주세요.<br>자리익힘은 물리 키보드로 연습합니다.</p></div>
<div id="practice" hidden><div class="meter"><span>진행 <b id="progress">0</b></span><span>시간 <b id="elapsed">00:00</b></span><span>현재 타수 <b id="speed">0</b></span><span>정확도 <b id="accuracy">100%</b></span></div><div id="entry-wrap" class="entry"><label for="entry" id="entry-label">낱말을 입력하고 Enter를 누르세요.</label><div class="entry-line"><input id="entry" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-describedby="feedback"><button id="submit">입력 ↵</button></div></div><p id="feedback" role="status"></p><div class="practice-actions"><button id="start">연습 시작</button><button id="pause">일시정지</button><button id="finish">연습 마치기</button></div></div>
<div id="puzzle" class="puzzle" hidden><div><div id="puzzle-board" class="puzzle-board"></div><div class="puzzle-actions"><button id="check-puzzle">정답 확인</button><button id="clear-puzzle">다시 풀기</button></div><p id="puzzle-status" role="status">빈칸에 한 글자씩 입력하세요.</p></div><div class="clues"><h3>가로 열쇠</h3><ol id="across"></ol><h3>세로 열쇠</h3><ol id="down"></ol></div></div>
<div id="history" class="history" hidden><h2>내 연습 기록</h2><p>기록은 이 기기의 브라우저에 저장됩니다.</p><div id="records"></div><button id="export">기록 내려받기</button></div><footer class="statusbar"><span id="status" role="status">실행 파일을 불러오는 중…</span><span>한메 3.05</span></footer></section><p class="credits">원작 한메소프트 · 웹용 WASM 포팅 <button id="about">포팅 정보</button></p></main>
<dialog id="modal"><div class="dialog-title" id="modal-title"></div><div id="modal-body"></div><form method="dialog"><button>닫기</button></form></dialog></div><script src="./practice-order.js?v=8" defer></script><script src="./app.js?v=8" defer></script><script src="./canvas-ui.js?v=8" defer></script></body></html>
